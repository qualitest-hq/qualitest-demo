# =============================================================================
# 开发环境（profile=dev）
# 敏感项用 ${ENV:default}；本机密钥优先复制根目录 .env.example → .env，或用 application-local.yml（勿提交）
# =============================================================================

# -----------------------------------------------------------------------------
# 项目基础信息（读取后用于页脚、关于、文件上传路径等）
# -----------------------------------------------------------------------------
demo:
  name: Qualitest Demo          # 显示名称
  version: 1.0.0                # 版本号
  copyrightYear: 2026           # 版权年份
  profile: ${DEMO_PROFILE:D:/demo/uploadPath}     # 本地上传文件落盘根目录
  addressEnabled: false         # 登录日志是否解析 IP 所在地
  captchaType: math             # 登录验证码：math 算术 / char 字符
  # RustFS（S3 兼容对象存储，进阶文件 API）
  rustfs:
    enabled: ${DEMO_RUSTFS_ENABLED:true}
    endpoint: ${DEMO_RUSTFS_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${DEMO_RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${DEMO_RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${DEMO_RUSTFS_BUCKET:qualitest-demo}
    region: us-east-1
    public-base-url: ${DEMO_RUSTFS_PUBLIC_BASE_URL:http://127.0.0.1:9000/qualitest-demo}

# -----------------------------------------------------------------------------
# 内嵌 Tomcat
# -----------------------------------------------------------------------------
server:
  port: 8081                    # HTTP 端口（靶场默认 8081）
  servlet:
    context-path: /             # 应用上下文路径
  tomcat:
    uri-encoding: UTF-8         # URL 解码字符集
    accept-count: 1000          # 连接满后排队长度
    threads:
      max: 800                  # 最大工作线程
      min-spare: 100            # 最小空闲线程

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    com.demo: debug             # 业务包：开发期输出调试信息
    org.springframework: warn   # 框架包：减少噪音

# -----------------------------------------------------------------------------
# 账户口令安全（连续输错锁定）
# -----------------------------------------------------------------------------
user:
  password:
    maxRetryCount: 5            # 最大连续错误次数
    lockTime: 10                # 锁定时长（分钟）

# -----------------------------------------------------------------------------
# Spring 通用
# -----------------------------------------------------------------------------
spring:
  messages:
    basename: i18n/messages     # 国际化资源文件
  servlet:
    multipart:
      max-file-size: 10MB       # 单文件上传上限
      max-request-size: 20MB    # 单次请求上传总上限
  devtools:
    restart:
      enabled: true             # 开发热重启
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:11}              # 逻辑库号（与主系统错开）
      password: ${SPRING_DATA_REDIS_PASSWORD:}                 # 无密码留空
      timeout: 10s              # 命令超时
      lettuce:
        pool:
          min-idle: 0           # 池中最小空闲连接
          max-idle: 8           # 池中最大空闲连接
          max-active: 8         # 池最大活跃连接
          max-wait: -1ms        # 借连接最长等待（-1 不限制）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://localhost:3306/qualitest-demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
        username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
        password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:123456}
      slave:
        enabled: false          # 从库开关
        url:
        username:
        password:
      initialSize: 5            # 池初始连接数
      minIdle: 10               # 池最小空闲
      maxActive: 20             # 池最大活跃
      maxWait: 60000            # 取连接最长等待（毫秒）
      connectTimeout: 30000     # 建连超时（毫秒）
      socketTimeout: 60000      # 读超时（毫秒）
      timeBetweenEvictionRunsMillis: 60000       # 空闲检测间隔
      minEvictableIdleTimeMillis: 300000        # 连接最小空闲存活
      maxEvictableIdleTimeMillis: 900000        # 连接最大空闲存活
      validationQuery: SELECT 1 FROM DUAL       # 存活检测 SQL
      testWhileIdle: true       # 空闲时检测连接
      testOnBorrow: false       # 借出时不检测（性能考虑）
      testOnReturn: false       # 归还时不检测
      webStatFilter:
        enabled: true           # Web 请求统计过滤器
      statViewServlet:
        enabled: true           # Druid 监控页 /druid/*
        allow:                  # 监控页 IP 白名单（空=不限制）
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:demo}    # 监控页登录名
        login-password: ${DRUID_STAT_PASSWORD:123456}  # 监控页密码
      filter:
        stat:
          enabled: true
          log-slow-sql: true    # 慢 SQL 写日志
          slow-sql-millis: 1000 # 慢 SQL 阈值（毫秒）
          merge-sql: true       # 合并相似 SQL 统计
        wall:
          config:
            multi-statement-allow: true  # 允许多语句（场景脚本需要）

# -----------------------------------------------------------------------------
# JWT（管理端 /web/** 与客户端 /api/** 各自签发，勿混用）
# -----------------------------------------------------------------------------
token:
  header: Authorization         # 请求头携带 Token 的字段名
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}  # 签名密钥（生产务必更换）
  expireTime: 30                # Token 有效期（分钟）

# -----------------------------------------------------------------------------
# MyBatis
# -----------------------------------------------------------------------------
mybatis:
  typeAliasesPackage: com.demo.**.domain,com.demo.**.params,com.demo.**.result,com.demo.**.apiParams,com.demo.**.apiResult
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# -----------------------------------------------------------------------------
# 分页插件
# -----------------------------------------------------------------------------
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI（按 URL 前缀分组展示接口）
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: admin
      display-name: 管理端
      paths-to-match: /web/**
      packages-to-scan:
        - com.demo.web.controller.mall
        - com.demo.web.controller.account
        - com.demo.web.controller.coupon
        - com.demo.web.controller.system
    - group: api
      display-name: 客户端
      paths-to-match: /api/**
      packages-to-scan: com.demo.web.apiController
    - group: tool
      display-name: 示例
      paths-to-match: /test/**
      packages-to-scan: com.demo.web.controller.tool

# -----------------------------------------------------------------------------
# 防盗链（校验 Referer 是否在允许域名内）
# -----------------------------------------------------------------------------
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

# -----------------------------------------------------------------------------
# XSS 过滤（对匹配路径的请求体/参数做脚本清理）
# -----------------------------------------------------------------------------
xss:
  enabled: true
  excludes: /system/notice      # 跳过的路径
  urlPatterns: /system/*,/monitor/*,/tool/*

# -----------------------------------------------------------------------------
# 被测数据快照端点（POST /test-support/snapshot、/restore）
# 默认整库 mysqldump；实现见 MysqldumpSnapshotStrategy
# -----------------------------------------------------------------------------
qualitest:
  test-support:
    enabled: true               # 开启端点（非 prod/production/prd profile）
    default-timeout-ms: 360000  # HTTP 等待 Strategy 完成的最长时间，整库备份宜适当加大
