# =============================================================================
# Docker / Compose 环境（profile=docker）
# 启动：-Dspring.profiles.active=docker
# 敏感项通过环境变量注入（见仓库根目录 .env.example）
# =============================================================================

demo:
  name: Qualitest Demo
  version: 1.0.0
  copyrightYear: 2026
  profile: ${DEMO_PROFILE:/data/upload}
  addressEnabled: false
  captchaType: math
  rustfs:
    enabled: ${DEMO_RUSTFS_ENABLED:false}
    endpoint: ${DEMO_RUSTFS_ENDPOINT:http://rustfs:9000}
    access-key: ${DEMO_RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${DEMO_RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${DEMO_RUSTFS_BUCKET:qualitest-demo}
    region: us-east-1
    public-base-url: ${DEMO_RUSTFS_PUBLIC_BASE_URL:http://127.0.0.1:9000/qualitest-demo}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.demo: ${LOGGING_LEVEL_COM_DEMO:info}
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:11}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://mysql:3306/qualitest-demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
        username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
        password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:}
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
        allow:
        url-pattern: /druid/*
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

token:
  header: Authorization
  secret: ${TOKEN_SECRET:}
  expireTime: ${TOKEN_EXPIRE_TIME:1440}

mybatis:
  typeAliasesPackage: com.demo.**.domain,com.demo.**.params,com.demo.**.result,com.demo.**.apiParams,com.demo.**.apiResult
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: admin
      display-name: 管理端
      paths-to-match: /web/**
      packages-to-scan:
        - com.demo.web.controller.mall
        - com.demo.web.controller.account
        - com.demo.web.controller.coupon
        - com.demo.web.controller.system
    - group: api
      display-name: 客户端
      paths-to-match: /api/**
      packages-to-scan: com.demo.web.apiController
    - group: tool
      display-name: 示例
      paths-to-match: /test/**
      packages-to-scan: com.demo.web.controller.tool

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

# docker profile 非 prod，test-support 可开（供质衡 checkpoint 联调）
qualitest:
  test-support:
    enabled: ${QUALITEST_TEST_SUPPORT_ENABLED:true}
    default-timeout-ms: 360000
