# 推送官方镜像到 GHCR，并在配置了 ALIYUN_PASSWORD 时再推阿里云公开仓库。
# 镜像：
#   ghcr.io/qualitest-hq/qualitest-demo-app|web|mysql
#   registry.cn-hangzhou.aliyuncs.com/qualitest-hq/qualitest-demo-app|web|mysql
# PR / fork 不推送；未配阿里云密钥则只推 GHCR。
#
# 首次推送后若 Packages 默认 Private：组织 Packages 页改为 Public，
# 或本 workflow 末尾「Set package visibility」步骤会尝试公开。

name: GHCR

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "deploy/docker/**"
      - "deploy/nginx/**"
      - "deploy/mysql/**"
      - "docker-compose.yml"
      - "pom.xml"
      - "demo-admin/**"
      - "demo-common/**"
      - "demo-framework/**"
      - "demo-generator/**"
      - "demo-quartz/**"
      - "demo-system/**"
      - "test-support-starter/**"
      - "demo-ui/**"
      - "sql/seed/**"
      - ".github/workflows/ghcr.yml"
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: qualitest-hq

jobs:
  changes:
    name: detect-changes
    if: github.repository == 'qualitest-hq/qualitest-demo'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
      mysql: ${{ steps.filter.outputs.mysql }}
      force: ${{ steps.force.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Force all on workflow_dispatch
        id: force
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pom.xml'
              - 'demo-admin/**'
              - 'demo-common/**'
              - 'demo-framework/**'
              - 'demo-generator/**'
              - 'demo-quartz/**'
              - 'demo-system/**'
              - 'test-support-starter/**'
              - 'sql/seed/**'
              - '.github/workflows/ghcr.yml'
            web:
              - 'deploy/docker/Dockerfile.web'
              - 'deploy/nginx/**'
              - 'docker-compose.yml'
              - 'demo-ui/**'
              - '.github/workflows/ghcr.yml'
            mysql:
              - 'deploy/docker/Dockerfile.mysql'
              - 'deploy/mysql/**'
              - 'docker-compose.yml'
              - '.github/workflows/ghcr.yml'

  push-app:
    name: push-app
    needs: changes
    if: >
      github.repository == 'qualitest-hq/qualitest-demo' &&
      (needs.changes.outputs.force == 'true' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/qualitest-demo-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-app
          cache-to: type=gha,mode=max,scope=qualitest-demo-app

      - name: Skip ACR if unconfigured
        if: ${{ secrets.ALIYUN_PASSWORD == '' }}
        run: echo "::notice::ALIYUN_PASSWORD 未配置，跳过阿里云推送。"

      - name: Log in to Aliyun ACR
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata (app ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        id: meta-acr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/qualitest-demo-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push app (ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-app
          cache-to: type=gha,mode=max,scope=qualitest-demo-app

  push-web:
    name: push-web
    needs: changes
    if: >
      github.repository == 'qualitest-hq/qualitest-demo' &&
      (needs.changes.outputs.force == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/qualitest-demo-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-web
          cache-to: type=gha,mode=max,scope=qualitest-demo-web

      - name: Skip ACR if unconfigured
        if: ${{ secrets.ALIYUN_PASSWORD == '' }}
        run: echo "::notice::ALIYUN_PASSWORD 未配置，跳过阿里云推送。"

      - name: Log in to Aliyun ACR
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata (web ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        id: meta-acr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/qualitest-demo-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push web (ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-web
          cache-to: type=gha,mode=max,scope=qualitest-demo-web

  push-mysql:
    name: push-mysql
    needs: changes
    if: >
      github.repository == 'qualitest-hq/qualitest-demo' &&
      (needs.changes.outputs.force == 'true' || needs.changes.outputs.mysql == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (mysql)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/qualitest-demo-mysql
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push mysql
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.mysql
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-mysql
          cache-to: type=gha,mode=max,scope=qualitest-demo-mysql

      - name: Skip ACR if unconfigured
        if: ${{ secrets.ALIYUN_PASSWORD == '' }}
        run: echo "::notice::ALIYUN_PASSWORD 未配置，跳过阿里云推送。"

      - name: Log in to Aliyun ACR
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata (mysql ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        id: meta-acr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/qualitest-demo-mysql
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push mysql (ACR)
        if: ${{ secrets.ALIYUN_PASSWORD != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.mysql
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          cache-from: type=gha,scope=qualitest-demo-mysql
          cache-to: type=gha,mode=max,scope=qualitest-demo-mysql

  visibility:
    name: package-visibility
    needs: [push-app, push-web, push-mysql]
    if: >
      always() &&
      github.repository == 'qualitest-hq/qualitest-demo' &&
      (needs.push-app.result == 'success' || needs.push-web.result == 'success' || needs.push-mysql.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure packages are public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          for pkg in qualitest-demo-app qualitest-demo-web qualitest-demo-mysql; do
            echo "Set visibility public: ${org}/${pkg}"
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${org}/packages/container/${pkg}/visibility" \
              -f visibility=public \
              || echo "::warning::Could not set ${pkg} public (may already be public, or needs org Package admin). Set manually: https://github.com/orgs/${org}/packages"
          done
